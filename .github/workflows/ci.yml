name: Windows checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Check public tree
        shell: pwsh
        run: ./scripts/Test-PublicTree.ps1
      - name: Core regression tests
        run: dotnet run --project tests/QuotaWidget.Tests -c Release
      - name: WPF interaction and layout tests
        run: dotnet run --project tests/QuotaWidget.UiTests -c Release
      - name: Build distributable
        shell: pwsh
        run: ./scripts/Build-Release.ps1
